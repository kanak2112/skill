/* Build the DOM. */
const stage = document.getElementById("stage");
PAGES.forEach((pg, i) => {
  const el = document.createElement("div");
  el.className = "sheet" + (pg.cls ? " " + pg.cls : "");
  el.style.display = "none";
  let html = "";
  for (const p of pg.panels) {
    const style = `left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px;${p.color ? `background:${p.color};` : ""}${p.bare ? "border:0;box-shadow:none;" : ""}`;
    if (p.img) html += `<div class="panel" data-id="${p.id}" style="${style}"><img class="art" src="panels/${p.img}.jpg">`;
    else if (p.screen) html += `<div class="panel screen" data-id="${p.id}" style="${style}"><img class="feed"><div class="tab">${p.screen.label}</div>`;
    else html += `<div class="panel text" data-id="${p.id}" style="${style}"><div class="big" style="${p.color === "var(--teal)" || p.color === "var(--orange)" ? "color:#fbf4e2" : ""}">${p.text}</div>`;
    html += `</div>`;
    for (const [k, c] of (p.caps || []).entries()) {
      html += `<div class="cap" data-cap="${p.id}-${k}" style="left:${p.x + c.x * p.w}px;top:${p.y + c.y * p.h}px;width:${c.w}px">${c.t}</div>`;
    }
  }
  if (pg.part) html += `<div class="cap teal part" style="font:400 20px/1 Bangers, sans-serif;letter-spacing:.08em;padding:9px 14px 7px">${pg.part}</div>`;
  if (pg.extra) html += pg.extra;
  if (!pg.cls) html += `<div class="pagenum">${i}</div>`;
  el.innerHTML = html;
  stage.appendChild(el);
  pg.el = el;
  pg.dur = pg.beats.reduce((a, b) => a + b.d, 0);
  let t = 0;
  for (const b of pg.beats) { b.t0 = t; t += b.d; }
});
let acc = 0;
for (const pg of PAGES) { pg.start = acc; acc += pg.dur + TURN; }
const TOTAL = acc - TURN;
window.__total = TOTAL;

const ease = (k) => (k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const back = (k) => { const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
function cam(pg, b) {
  if (b.p === "all") return { s: 1, cx: SX + W / 2, cy: SY + H / 2 };
  const r = pg.panels.find((p) => p.id === b.p);
  const s = Math.min(.9 * VW / r.w, .86 * VH / r.h, 2.5);
  return { s, cx: SX + r.x + r.w / 2, cy: SY + r.y + r.h / 2 };
}
function camAt(pg, t) {
  let i = pg.beats.findIndex((b) => t < b.t0 + b.d); if (i < 0) i = pg.beats.length - 1;
  const b = pg.beats[i], to = cam(pg, b), from = i ? cam(pg, pg.beats[i - 1]) : (pg.cls ? to : { s: 1, cx: SX + W / 2, cy: SY + H / 2 });
  const k = ease(Math.min(1, (t - b.t0) / 1.1));
  const drift = 1 + .018 * Math.min(1, (t - b.t0) / b.d);
  const s = (from.s + (to.s - from.s) * k) * drift, cx = from.cx + (to.cx - from.cx) * k, cy = from.cy + (to.cy - from.cy) * k;
  return { s, x: VW / 2 - cx * s, y: VH / 2 - cy * s };
}
const SRC = new URLSearchParams(location.search).get("src") || "frames-clean";
const frameUrl = (n) => `${SRC}/${String(n).padStart(6, "0")}.jpg`;
async function setPage(pg, t, offsetX, rot) {
  const el = pg.el, c = camAt(pg, Math.max(0, Math.min(pg.dur, t)));
  el.style.display = "block";
  // The sheet sits at the origin; the camera maps desk coordinates (sheet + SX, SY) to the viewport.
  el.style.left = "0px"; el.style.top = "0px";
  el.style.transform = `translate(${c.x + SX * c.s + offsetX}px, ${c.y + SY * c.s}px) scale(${c.s}) rotate(${rot}deg)`;
  // Captions pop in at their time.
  for (const p of pg.panels) for (const [k, cp] of (p.caps || []).entries()) {
    const n = el.querySelector(`[data-cap="${p.id}-${k}"]`), d = t - cp.at;
    n.style.opacity = d <= 0 ? 0 : Math.min(1, d / .18);
    n.style.transform = d <= 0 ? "scale(.6)" : `scale(${.6 + .4 * back(Math.min(1, d / .35))}) rotate(${-.6 + .6 * Math.min(1, d / .35)}deg)`;
  }
  // Screen panels play from their beat's start.
  const waits = [];
  for (const p of pg.panels) if (p.screen) {
    const b = pg.beats.find((x) => x.p === p.id), sc = p.screen;
    const n = Math.min(sc.to, sc.from + Math.max(0, Math.floor((t - b.t0) * FPS * sc.speed)));
    const img = el.querySelector(`[data-id="${p.id}"] img.feed`), url = frameUrl(n);
    if (img.getAttribute("src") !== url) { img.setAttribute("src", url); waits.push(img.decode().catch(() => {})); }
  }
  return Promise.all(waits);
}
window.__setTime = async (T) => {
  for (const pg of PAGES) pg.el.style.display = "none";
  const i = PAGES.findIndex((pg, k) => T < pg.start + pg.dur + TURN || k === PAGES.length - 1);

  if (t <= pg.dur || i === PAGES.length - 1) return setPage(pg, t, 0, 0);

  const k = ease((t - pg.dur) / TURN), nx = PAGES[i + 1];
  return Promise.all([setPage(pg, pg.dur, -1600 * k, -4 * k), setPage(nx, 0, 1600 * (1 - k), 4 * (1 - k))]);
};
